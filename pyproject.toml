[build-system]
requires = ["hatchling", "hatch-babel"]
build-backend = "hatchling.build"

[project]
name = "pytr"
version = "0.4.10"
description = "Use TradeRepublic in terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "marzzzello", email = "853485-marzzzello@users.noreply.gitlab.com" }
]
urls = { "Homepage" = "https://github.com/pytr-org/pytr" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "babel>=2.18.0",
    "certifi>=2026.7.22",
    "coloredlogs>=15.0.1",
    "cryptography>=50.0.0",
    "curl_cffi>=0.16.0",
    "keyring>=25.7.0",
    "packaging>=26.3",
    "pathvalidate>=3.3.1",
    "playwright>=1.62.0",
    "pygments>=2.20.0",
    "requests_futures>=1.0.2",
    "shtab>=1.9.3",
    "websockets>=14",
]

[project.scripts]
pytr = "pytr.main:main"

[tool.hatch.build.hooks.babel]
locale_dir = "pytr/locale"

[dependency-groups]
dev = [
    "ruff==0.9.6",
    "pytest>=8.3.4",
    "mypy>=1.15.0",
    "types-babel>=2.11.0.15",
    "types-requests>=2.32.0.20241016",
    "types-pygments>=2.19.0.20250107",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.10"
