name: Build and publish Python distributions to PyPI

on:
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

env:
  UV_VERSION: 0.5.31

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master as of 2020-07-13
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 as of 2026-03-16
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Pytest
        run: uv run pytest
      - name: Ruff check
        run: uvx ruff@0.9.6 check
      - name: Ruff format
        run: uvx ruff@0.9.6 format --check --diff
      - name: Mypy type check
        run: uv run mypy .
      - name: Check if README.md automatically generated content is up to date
        run: diff -u <(cat README.md | sed -z '$s/\n*$//') <(uvx mksync@0.1.5 README.md | sed -z '$s/\n*$//')

  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master as of 2020-07-13
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 as of 2026-03-16
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build wheel
        run: uv build
      - name: Publish distribution to PyPI
        if: startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 as of 2026-07-28
        with:
          password: ${{ secrets.pypi_token }}
